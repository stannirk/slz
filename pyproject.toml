[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slz-cli"
version = "0.1.2"
description = "The interactive command-line tool that translates your visual filtering into powerful awk and grep commands."
readme = "README.md"
requires-python = ">=3.6"
license = {text = "MIT"}
authors = [
    {name = "stannirk"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/user/slz"

[project.scripts]
slz = "slz:run"

[tool.hatch.build.targets.wheel]
packages = ["src/slz"]
